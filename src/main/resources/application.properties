spring.application.name=cybersourceCashflows

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cybersource_tms
spring.data.mongodb.auto-index-creation=true

# Cybersource API Configuration
cybersource.key-id=08c94399-9993-47ce-a2d5-e053a07fa139
cybersource.api-key=YOUR_API_KEY
cybersource.secret-key=YOUR_SECRET_KEY
cybersource.merchant-id=YOUR_MERCHANT_ID
cybersource.base-url=https://apitest.cybersource.com

# AWS SQS Configuration
aws.sqs.region=us-east-1
aws.sqs.access-key=
aws.sqs.secret-key=
aws.sqs.endpoint=
aws.sqs.queue-url=https://sqs.us-east-1.amazonaws.com/123456789012/token-lifecycle-queue
aws.sqs.dlq-url=https://sqs.us-east-1.amazonaws.com/123456789012/token-lifecycle-dlq

# Webhook Security Configuration
webhook.signature.secret=YOUR_WEBHOOK_SECRET_KEY

# Billing Audit Sync Configuration
# Offset in minutes from current time to avoid database replication lag
billing.sync.offset-minutes=5
# Batch size for processing records
billing.sync.batch-size=1000
# MongoDB collection for sequence generation
billing.sequence.collection=BillingSequence

# Logging Configuration
logging.level.com.example.cybersource=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG