spring.application.name=cybersourceCashflows

# MongoDB Configuration
# Override with env vars SPRING_DATA_MONGODB_HOST / SPRING_DATA_MONGODB_DATABASE
# (Spring Boot's relaxed binding converts env var names automatically)
spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:cybersource_tms}
spring.data.mongodb.auto-index-creation=true

# Cybersource API Configuration
# Override via environment variables: CYBERSOURCE_KEY_ID, CYBERSOURCE_API_KEY, etc.
cybersource.key-id=${CYBERSOURCE_KEY_ID:08c94399-9993-47ce-a2d5-e053a07fa139}
cybersource.api-key=${CYBERSOURCE_API_KEY:YOUR_API_KEY}
cybersource.secret-key=${CYBERSOURCE_SECRET_KEY:YOUR_SECRET_KEY}
cybersource.merchant-id=${CYBERSOURCE_MERCHANT_ID:YOUR_MERCHANT_ID}
cybersource.base-url=${CYBERSOURCE_BASE_URL:https://apitest.cybersource.com}

# AWS SQS Configuration
# For local development, point aws.sqs.endpoint to Ministack (e.g. http://localhost:4566)
# Override via env vars: AWS_SQS_REGION, AWS_SQS_ACCESS_KEY, AWS_SQS_ENDPOINT, etc.
aws.sqs.region=${AWS_SQS_REGION:us-east-1}
aws.sqs.access-key=${AWS_SQS_ACCESS_KEY:}
aws.sqs.secret-key=${AWS_SQS_SECRET_KEY:}
aws.sqs.endpoint=${AWS_SQS_ENDPOINT:}
aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/123456789012/token-lifecycle-queue}
aws.sqs.dlq-url=${AWS_SQS_DLQ_URL:https://sqs.us-east-1.amazonaws.com/123456789012/token-lifecycle-dlq}

# Webhook Security Configuration
# Override via env var: WEBHOOK_SIGNATURE_SECRET
webhook.signature.secret=${WEBHOOK_SIGNATURE_SECRET:YOUR_WEBHOOK_SECRET_KEY}

# Billing Audit Sync Configuration
# Offset in minutes from current time to avoid database replication lag
billing.sync.offset-minutes=5
# Batch size for processing records
billing.sync.batch-size=1000
# MongoDB collection for sequence generation
billing.sequence.collection=BillingSequence

# Logging Configuration
logging.level.com.example.cybersource=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG